name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libime-bin fcitx5-material-color xz-utils curl python3

      - name: Build package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-0.1.0}"
          VERSION="$VERSION" ./packaging/build-deb.sh

      - name: Smoke test
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -q "usr/share/fcitx5/themes/Material-Color-green/theme.conf"
          dpkg-deb --contents "$deb" | grep -q "etc/xdg/fcitx5/conf/cloudpinyin.conf"
          dpkg-deb --contents "$deb" | grep -q "usr/share/fcitx5-zh-doctor/zhwiki.txt.xz"
          echo "package layout ok"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
